<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F80E2"/>
      <stop offset="100%" stop-color="#3E54D3"/>
    </linearGradient>
    <radialGradient id="iris" cx="45%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="55%" stop-color="#15CDCA"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Robotic eye housing -->
  <ellipse cx="50" cy="50" rx="34" ry="30" fill="none" stroke="white" stroke-width="4" opacity="0.95"/>
  <path d="M18 50 H28 M72 50 H82" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Inner socket -->
  <circle cx="50" cy="50" r="24" fill="#0D1830" stroke="white" stroke-width="2.5"/>

  <!-- Glowing iris -->
  <circle cx="50" cy="50" r="15" fill="url(#iris)"/>

  <!-- Robotic slit pupil -->
  <ellipse cx="50" cy="50" rx="3.2" ry="11" fill="#0D1830"/>

  <!-- Lens highlight -->
  <circle cx="44" cy="44" r="4.5" fill="white" opacity="0.45"/>

  <!-- Corner brackets -->
  <path d="M30 34 L30 28 L36 28 M70 34 L70 28 L64 28 M30 66 L30 72 L36 72 M70 66 L70 72 L64 72"
        fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- Live status dot -->
  <circle cx="78" cy="22" r="8" fill="#15CDCA" opacity="0.85"/>
  <circle cx="78" cy="22" r="4" fill="white"/>
</svg>
